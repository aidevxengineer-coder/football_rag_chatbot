global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Each "job_name" becomes the `job` label on every metric scraped from
  # that target -- that's what lets you distinguish services in queries
  # like `sum by (job) (rate(futbot_http_requests_total[5m]))`, since the
  # metric names themselves are shared across services on purpose.
  - job_name: auth
    static_configs:
      - targets: ["auth:8081"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: chat
    static_configs:
      - targets: ["chat:8082"]
  - job_name: project
    static_configs:
      - targets: ["project:8083"]
  - job_name: rag-orchestrator
    static_configs:
      - targets: ["rag-orchestrator:8084"]
  - job_name: retrieval
    static_configs:
      - targets: ["retrieval:8085"]
  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8086"]
  - job_name: llm-gateway
    static_configs:
      - targets: ["llm-gateway:8087"]
  - job_name: tools
    static_configs:
      - targets: ["tools:8088"]
  - job_name: observability
    static_configs:
      - targets: ["observability:8090"]
