# Discovers every running container via the Docker socket and ships its
# stdout to Loki. Since every FutBot service already logs structured JSON
# (see futbot_common.logging_config), the pipeline_stages below parse
# each line and promote `service` / `level` to indexed Loki labels --
# `correlation_id` is deliberately NOT promoted to a label (it's
# effectively unique per request; as a label it would blow up Loki's
# index cardinality). To find logs for one request, label-filter by
# service/level in Grafana's Explore view and then text-filter the log
# body for `"correlation_id":"<id>"` -- see the docs note in the
# handoff message for the exact query.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "compose_project"
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            timestamp: timestamp
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339
