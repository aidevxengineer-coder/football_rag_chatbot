<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitchside — Auth (modal reference)</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="theme.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      letter-spacing: var(--letter-spacing);
      background: var(--background);
      color: var(--foreground);
      overflow: hidden;
    }

    /* —— Blurred / darkened chat backdrop —— */
    .app-backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      filter: blur(8px) brightness(0.45);
      transform: scale(1.02);
      pointer-events: none;
      user-select: none;
    }

    .backdrop-sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--sidebar-border);
      padding: 1rem;
    }

    .backdrop-brand {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }

    .backdrop-pill {
      height: 2.5rem;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--primary) 35%, transparent);
      margin-bottom: 1rem;
    }

    .backdrop-line {
      height: 2.25rem;
      border-radius: var(--radius);
      background: var(--muted);
      margin-bottom: 0.5rem;
    }

    .backdrop-main {
      flex: 1;
      position: relative;
      background:
        radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.45) 100%),
        var(--background);
      padding: 2rem;
    }

    .backdrop-bubble {
      max-width: 28rem;
      padding: 1rem 1.15rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      font-size: 0.9rem;
    }

    .backdrop-bubble.user {
      margin-left: auto;
      background: color-mix(in srgb, var(--accent) 35%, var(--background));
    }

    .backdrop-scrim {
      position: fixed;
      inset: 0;
      background: rgba(4, 12, 8, 0.55);
      z-index: 40;
      cursor: default;
    }

    /* —— Auth modal —— */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: default;
    }

    .auth-shell {
      width: 100%;
      max-width: 26rem;
      cursor: default;
    }

    .auth-card {
      position: relative;
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 2);
      padding: 1.75rem 1.75rem 1.5rem;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.2),
        0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .auth-close {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .auth-close:hover {
      color: var(--foreground);
      background: var(--muted);
      border-color: var(--border);
    }

    .auth-close .material-symbols-outlined {
      font-size: 1.25rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 0 1.75rem;
    }

    .auth-title {
      margin: 0 0 0.5rem;
      font-family: var(--font-sans);
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--foreground);
    }

    .auth-subtitle {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.45;
      color: var(--muted-foreground);
    }

    .oauth-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .oauth-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 2.5rem;
      padding: 0 0.875rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .oauth-btn:hover {
      background: var(--muted);
      border-color: var(--ring);
    }

    .oauth-btn svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0 0 1.25rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      white-space: nowrap;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      margin: 0;
      position: relative;
    }

    .field[hidden] {
      display: none !important;
    }

    .field label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--foreground);
    }

    .field input {
      width: 100%;
      height: 2.5rem;
      padding: 0 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field input::placeholder {
      color: color-mix(in srgb, var(--muted-foreground) 70%, transparent);
    }

    .field input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 1px var(--ring);
    }

    .field input.is-invalid {
      border-color: var(--destructive);
      box-shadow: 0 0 0 1px var(--destructive);
    }

    .field input.is-invalid:focus {
      border-color: var(--destructive);
      box-shadow: 0 0 0 1px var(--destructive);
    }

    /* Themed validation tooltip — floats above the field, no layout shift */
    .field-tooltip {
      position: absolute;
      left: 0;
      bottom: calc(100% - 0.15rem);
      z-index: 5;
      display: none;
      max-width: min(100%, 16rem);
      padding: 0.35rem 0.55rem;
      border-radius: var(--radius);
      border: 1px solid color-mix(in srgb, var(--destructive) 55%, var(--border));
      background: var(--popover);
      color: var(--destructive);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: var(--letter-spacing);
      box-shadow:
        0 1px 2px color-mix(in srgb, var(--shadow-color) calc(var(--shadow-opacity) * 100%), transparent),
        0 6px 16px rgba(0, 0, 0, 0.28);
      pointer-events: none;
      white-space: nowrap;
    }

    .field-tooltip::before {
      content: "";
      position: absolute;
      left: 0.85rem;
      top: 100%;
      border: 5px solid transparent;
      border-top-color: color-mix(in srgb, var(--destructive) 55%, var(--border));
    }

    .field-tooltip::after {
      content: "";
      position: absolute;
      left: 0.95rem;
      top: 100%;
      border: 4px solid transparent;
      border-top-color: var(--popover);
    }

    .field.is-invalid .field-tooltip {
      display: block;
    }

    .submit-btn {
      width: 100%;
      height: 2.5rem;
      margin: 0;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--primary-foreground);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 150ms ease;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
    }

    .auth-footer {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    .auth-footer a {
      color: var(--foreground);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
    }

    .auth-footer a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <!-- Blurred chat UI behind modal -->
  <div class="app-backdrop" aria-hidden="true">
    <aside class="backdrop-sidebar">
      <div class="backdrop-brand">Pitchside</div>
      <div class="backdrop-pill"></div>
      <div class="backdrop-line"></div>
      <div class="backdrop-line"></div>
      <div class="backdrop-line"></div>
      <div class="backdrop-line"></div>
    </aside>
    <div class="backdrop-main">
      <div class="backdrop-bubble">Analyzing the opponent's high press structure...</div>
      <div class="backdrop-bubble user">Draft a counter-attacking strategy using our wing-backs.</div>
      <div class="backdrop-bubble">Here is the proposed tactical adjustment...</div>
    </div>
  </div>
  <div class="backdrop-scrim" id="auth-dismiss-scrim" aria-hidden="true"></div>

  <!-- Auth popup -->
  <div class="auth-overlay" id="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <main class="auth-shell" id="auth-shell">
      <section class="auth-card">
        <button type="button" class="auth-close" id="auth-close" aria-label="Close">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
        <header class="auth-header">
          <h1 id="auth-title" class="auth-title">Create an account</h1>
          <p id="auth-subtitle" class="auth-subtitle">Enter your details below to create your account</p>
        </header>

        <div class="oauth-row">
          <button type="button" class="oauth-btn" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <div class="divider" role="separator">
          <span>Or continue with</span>
        </div>

        <form class="auth-form" id="auth-form" action="#" method="post" autocomplete="on" novalidate data-mode="signup">
          <div class="field" id="field-first-name">
            <label for="first-name">First name</label>
            <input id="first-name" name="first_name" type="text" autocomplete="given-name" placeholder="Alex" required aria-describedby="first-name-error" />
            <span class="field-tooltip" id="first-name-error" role="alert"></span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="m@example.com" required aria-describedby="email-error" />
            <span class="field-tooltip" id="email-error" role="alert"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="8" aria-describedby="password-error" />
            <span class="field-tooltip" id="password-error" role="alert"></span>
          </div>
          <button type="submit" class="submit-btn" id="auth-submit">Create account</button>
        </form>

        <p class="auth-footer" id="auth-footer">
          <span id="auth-footer-lead">Already have an account?</span>
          <a href="#sign-in" id="auth-mode-toggle">Sign in</a>
        </p>
      </section>
    </main>
  </div>
  <script>
    (function () {
      function closeAuth() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'pitchai-analyst.html';
        }
      }

      document.getElementById('auth-close')?.addEventListener('click', closeAuth);
      document.getElementById('auth-dismiss-scrim')?.addEventListener('click', closeAuth);
      document.getElementById('auth-overlay')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeAuth();
      });
      document.getElementById('auth-shell')?.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAuth();
      });
    })();

    (function () {
      const form = document.getElementById('auth-form');
      if (!form) return;

      const titleEl = document.getElementById('auth-title');
      const subtitleEl = document.getElementById('auth-subtitle');
      const submitEl = document.getElementById('auth-submit');
      const toggleEl = document.getElementById('auth-mode-toggle');
      const footerLead = document.getElementById('auth-footer-lead');
      const firstNameField = document.getElementById('field-first-name');
      const firstNameInput = document.getElementById('first-name');
      const passwordInput = document.getElementById('password');

      const messages = {
        first_name: {
          valueMissing: 'Enter your first name.',
        },
        email: {
          valueMissing: 'Enter your email address.',
          typeMismatch: 'Enter a valid email address.',
        },
        password: {
          valueMissing: 'Enter a password.',
          tooShort: 'Password must be at least 8 characters.',
        },
      };

      function setMode(mode) {
        const signup = mode === 'signup';
        form.dataset.mode = mode;
        if (titleEl) titleEl.textContent = signup ? 'Create an account' : 'Sign in';
        if (subtitleEl) {
          subtitleEl.textContent = signup
            ? 'Enter your details below to create your account'
            : 'Enter your email and password to continue';
        }
        if (submitEl) submitEl.textContent = signup ? 'Create account' : 'Sign in';
        if (footerLead) {
          footerLead.textContent = signup ? 'Already have an account?' : 'Need an account?';
        }
        if (toggleEl) {
          toggleEl.textContent = signup ? 'Sign in' : 'Sign up';
          toggleEl.setAttribute('href', signup ? '#sign-in' : '#sign-up');
        }
        if (firstNameField) firstNameField.hidden = !signup;
        if (firstNameInput) {
          firstNameInput.required = signup;
          if (!signup) {
            firstNameInput.value = '';
            clearField(firstNameField);
          }
        }
        if (passwordInput) {
          passwordInput.autocomplete = signup ? 'new-password' : 'current-password';
          if (signup) passwordInput.setAttribute('minlength', '8');
          else passwordInput.removeAttribute('minlength');
        }
        form.querySelectorAll('.field.is-invalid').forEach((field) => clearField(field));
      }

      function messageFor(input) {
        const map = messages[input.name] || {};
        if (input.validity.valueMissing) return map.valueMissing || 'This field is required.';
        if (input.validity.typeMismatch) return map.typeMismatch || 'Enter a valid value.';
        if (input.validity.tooShort) return map.tooShort || `Must be at least ${input.minLength} characters.`;
        return input.validationMessage || 'Check this field.';
      }

      function clearField(field) {
        if (!field) return;
        field.classList.remove('is-invalid');
        const input = field.querySelector('input');
        const tip = field.querySelector('.field-tooltip');
        input?.classList.remove('is-invalid');
        input?.removeAttribute('aria-invalid');
        if (tip) tip.textContent = '';
      }

      function showFieldError(input) {
        const field = input.closest('.field');
        const tip = field?.querySelector('.field-tooltip');
        if (!field || !tip || field.hidden) return;
        tip.textContent = messageFor(input);
        field.classList.add('is-invalid');
        input.classList.add('is-invalid');
        input.setAttribute('aria-invalid', 'true');
      }

      function validateField(input) {
        const field = input.closest('.field');
        if (!field || field.hidden) return true;
        if (input.checkValidity()) {
          clearField(field);
          return true;
        }
        showFieldError(input);
        return false;
      }

      toggleEl?.addEventListener('click', (e) => {
        e.preventDefault();
        const next = form.dataset.mode === 'signup' ? 'signin' : 'signup';
        setMode(next);
        history.replaceState(null, '', next === 'signin' ? '#sign-in' : '#sign-up');
      });

      if (location.hash === '#sign-in') setMode('signin');
      else setMode('signup');

      form.querySelectorAll('input').forEach((input) => {
        input.addEventListener('input', () => {
          // Clear error only after submit has already flagged the field
          if (input.closest('.field')?.classList.contains('is-invalid')) {
            validateField(input);
          }
        });
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let firstInvalid = null;
        form.querySelectorAll('input').forEach((input) => {
          if (!validateField(input) && !firstInvalid) firstInvalid = input;
        });
        if (firstInvalid) {
          firstInvalid.focus();
          return;
        }
        // Mock success — Next.js: POST /auth/register or POST /auth/login
      });
    })();
  </script>
</body>
</html>
