apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: futbot
data:
  API_URL: "http://gateway:8000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: futbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: futbot-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: futbot
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: futbot-web
  namespace: futbot
spec:
  ingressClassName: nginx
  rules:
    - host: app.futbot.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
